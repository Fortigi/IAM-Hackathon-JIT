# JIT hackathon - alle diensten op één VM.
# Start met: cd /opt/jit/repo/compose && docker compose up -d
# .env wordt gemaakt door scripts/vm-bootstrap.sh (zie .env.example).

name: jit

x-restart: &restart
  restart: unless-stopped

networks:
  jit:
    name: jit

volumes:
  letsencrypt:
  authentik_db:
  authentik_data:
  midpoint_db:
  midpoint_home:
  corteza_db:
  corteza_data:

services:
  # ---------------------------------------------------------------- Traefik
  traefik:
    <<: *restart
    image: traefik:${TRAEFIK_TAG:-v3}
    command:
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=jit
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.le.acme.dnschallenge.provider=azuredns
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --accesslog=true
      - --log.level=INFO
    environment:
      AZURE_AUTH_METHOD: msi
      AZURE_SUBSCRIPTION_ID: ${AZ_SUBSCRIPTION_ID}
      AZURE_RESOURCE_GROUP: ${AZ_RG}
      AZURE_ZONE_NAME: ${DOMAIN}
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [jit]

  # ---------------------------------------------------------------- authentik
  authentik-db:
    <<: *restart
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AK_DB_PASS:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 10s
      retries: 10
    volumes:
      - authentik_db:/var/lib/postgresql/data
    networks: [jit]

  authentik-server: &authentik
    <<: *restart
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.3}
    command: server
    depends_on:
      authentik-db:
        condition: service_healthy
    shm_size: 512mb
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AK_DB_PASS:?}
      AUTHENTIK_SECRET_KEY: ${AK_SECRET_KEY:?}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AK_BOOTSTRAP_PASSWORD:?}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AK_BOOTSTRAP_TOKEN:?}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${ACME_EMAIL}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      # Waarden die de blueprints in seed/authentik/blueprints lezen met !Env
      JIT_DOMAIN: ${DOMAIN}
      JIT_TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?}
      JIT_HACK_ADMIN_PASSWORD: ${HACK_ADMIN_PASSWORD:?}
      JIT_ORCHESTRATOR_TOKEN: ${AK_ORCHESTRATOR_TOKEN:?}
      JIT_CORTEZA_CLIENT_SECRET: ${CORTEZA_OIDC_CLIENT_SECRET:?}
    volumes:
      - authentik_data:/data
      - ../seed/authentik/blueprints:/blueprints/custom:ro
    networks: [jit]
    labels:
      - traefik.enable=true
      - traefik.http.services.authentik.loadbalancer.server.port=9000
      - traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.service=authentik
      # Outpost-paden op de beschermde hosts (forward auth)
      - traefik.http.routers.authentik-outpost.rule=(Host(`wiki.${DOMAIN}`) || Host(`logs.${DOMAIN}`)) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.authentik-outpost.entrypoints=websecure
      - traefik.http.routers.authentik-outpost.service=authentik
      - traefik.http.routers.authentik-outpost.priority=100
      # Forward-auth middleware voor wiki en logs
      - traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version

  authentik-worker:
    <<: *authentik
    command: worker
    labels: []

  # ---------------------------------------------------------------- midPoint
  midpoint-db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: midpoint
      POSTGRES_PASSWORD: ${MP_DB_PASS:?}
      POSTGRES_INITDB_ARGS: --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midpoint"]
      interval: 10s
      retries: 10
    volumes:
      - midpoint_db:/var/lib/postgresql/data
    networks: [jit]

  midpoint-init:
    image: evolveum/midpoint:${MP_VER:-4.10.5}-alpine
    command: >
      bash -c "
      cd /opt/midpoint ;
      bin/midpoint.sh init-native ;
      bin/ninja.sh -B info >/dev/null 2>/tmp/ninja.log ;
      grep -q 'ERROR' /tmp/ninja.log && (
      bin/ninja.sh run-sql --create --mode REPOSITORY ;
      bin/ninja.sh run-sql --create --mode AUDIT
      ) || echo 'Repository init is niet nodig' ;
      "
    depends_on:
      midpoint-db:
        condition: service_healthy
    environment:
      MP_SET_midpoint_repository_jdbcUsername: midpoint
      MP_SET_midpoint_repository_jdbcPassword: ${MP_DB_PASS:?}
      MP_SET_midpoint_repository_jdbcUrl: jdbc:postgresql://midpoint-db:5432/midpoint
      MP_SET_midpoint_repository_database: postgresql
      MP_INIT_CFG: /opt/midpoint/var
    volumes:
      - midpoint_home:/opt/midpoint/var
    networks: [jit]

  midpoint:
    <<: *restart
    image: evolveum/midpoint:${MP_VER:-4.10.5}-alpine
    command: ["/opt/midpoint/bin/midpoint.sh", "container"]
    depends_on:
      midpoint-init:
        condition: service_completed_successfully
      midpoint-db:
        condition: service_healthy
    environment:
      MP_SET_midpoint_repository_jdbcUsername: midpoint
      MP_SET_midpoint_repository_jdbcPassword: ${MP_DB_PASS:?}
      MP_SET_midpoint_repository_jdbcUrl: jdbc:postgresql://midpoint-db:5432/midpoint
      MP_SET_midpoint_repository_database: postgresql
      MP_UNSET_midpoint_repository_hibernateHbm2ddl: "1"
      MP_NO_ENV_COMPAT: "1"
      MP_SET_midpoint_administrator_initialPassword: ${MP_ADMIN_PASSWORD:?}
      MP_MEM_MAX: 4096m
      MP_MEM_INIT: 1024m
      # Achter Traefik: X-Forwarded-* headers respecteren (Spring Boot)
      SERVER_FORWARDHEADERSSTRATEGY: NATIVE
    volumes:
      - midpoint_home:/opt/midpoint/var
      - ./runtime/midpoint/post-initial-objects:/opt/midpoint/var/post-initial-objects
      - ./runtime/midpoint/connid-connectors:/opt/midpoint/var/connid-connectors
      - ./runtime/midpoint/resource_files:/opt/midpoint/var/resource_files
    networks: [jit]
    labels:
      - traefik.enable=true
      - traefik.http.services.midpoint.loadbalancer.server.port=8080
      - traefik.http.routers.midpoint.rule=Host(`midpoint.${DOMAIN}`)
      - traefik.http.routers.midpoint.entrypoints=websecure
      - traefik.http.routers.midpoint.middlewares=midpoint-root
      - traefik.http.middlewares.midpoint-root.redirectregex.regex=^https://midpoint\.([^/]+)/?$$
      - traefik.http.middlewares.midpoint-root.redirectregex.replacement=https://midpoint.$${1}/midpoint/

  # ---------------------------------------------------------------- Corteza
  corteza-db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corteza
      POSTGRES_PASSWORD: ${CORTEZA_DB_PASS:?}
      POSTGRES_DB: corteza
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corteza"]
      interval: 10s
      retries: 10
    volumes:
      - corteza_db:/var/lib/postgresql/data
    networks: [jit]

  corteza:
    <<: *restart
    image: cortezaproject/corteza:${CORTEZA_VERSION:-2024.9}
    depends_on:
      corteza-db:
        condition: service_healthy
    environment:
      DOMAIN: portal.${DOMAIN}
      DB_DSN: postgres://corteza:${CORTEZA_DB_PASS}@corteza-db:5432/corteza?sslmode=disable
      HTTP_WEBAPP_ENABLED: "true"
      # TLS eindigt in Traefik; zonder deze vlag bouwt Corteza http://-URL's (lege pagina na inloggen)
      HTTP_SSL_TERMINATED: "true"
    volumes:
      - corteza_data:/data
    networks: [jit]
    labels:
      - traefik.enable=true
      - traefik.http.services.corteza.loadbalancer.server.port=80
      - traefik.http.routers.corteza.rule=Host(`portal.${DOMAIN}`)
      - traefik.http.routers.corteza.entrypoints=websecure

  # ---------------------------------------------------------------- Testapp en logs
  wiki:
    <<: *restart
    image: traefik/whoami:latest
    networks: [jit]
    labels:
      - traefik.enable=true
      - traefik.http.services.wiki.loadbalancer.server.port=80
      - traefik.http.routers.wiki.rule=Host(`wiki.${DOMAIN}`)
      - traefik.http.routers.wiki.entrypoints=websecure
      - traefik.http.routers.wiki.middlewares=authentik

  dozzle:
    <<: *restart
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [jit]
    labels:
      - traefik.enable=true
      - traefik.http.services.dozzle.loadbalancer.server.port=8080
      - traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)
      - traefik.http.routers.dozzle.entrypoints=websecure
      - traefik.http.routers.dozzle.middlewares=authentik
