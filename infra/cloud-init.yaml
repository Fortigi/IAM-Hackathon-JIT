#cloud-config
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - jq
  - gettext-base
  - unzip
  - curl
runcmd:
  - systemctl enable --now docker
  - usermod -aG docker "$(id -nu 1000)"
  - mkdir -p /opt/jit && chown 1000:1000 /opt/jit
final_message: "cloud-init klaar na $UPTIME seconden"
